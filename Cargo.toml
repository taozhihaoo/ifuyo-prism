[workspace]
resolver = "2"
members = [
    "crates/prism-core",
    "crates/prism-project",
    "crates/prism-parser",
    "crates/prism-analysis",
    "crates/prism-graph",
    "crates/prism-git",
    "crates/prism-changes",
    "crates/prism-impact",
    "crates/prism-health",
    "crates/prism-intel",
    "crates/prism-l0",
    "crates/prism-csharp",
    "crates/prism-godot",
    "crates/prism-health2",
    "crates/prism-supply",
    "crates/prism-debug",
    "crates/prism-verify",
    "crates/prism-env",
    "crates/prism-context",
    "crates/prism-store",
    "crates/prism-snapshot",
    "crates/prism-cli",
    "src-tauri",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
log = { version = "0.4", features = ["std"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }

prism-core = { path = "crates/prism-core" }
prism-project = { path = "crates/prism-project" }
prism-parser = { path = "crates/prism-parser" }
prism-analysis = { path = "crates/prism-analysis" }
prism-graph = { path = "crates/prism-graph" }
prism-git = { path = "crates/prism-git" }
prism-changes = { path = "crates/prism-changes" }
prism-impact = { path = "crates/prism-impact" }
prism-health = { path = "crates/prism-health" }
prism-intel = { path = "crates/prism-intel" }
prism-l0 = { path = "crates/prism-l0" }
prism-csharp = { path = "crates/prism-csharp" }
prism-godot = { path = "crates/prism-godot" }
prism-health2 = { path = "crates/prism-health2" }
prism-supply = { path = "crates/prism-supply" }
prism-debug = { path = "crates/prism-debug" }
prism-verify = { path = "crates/prism-verify" }
prism-env = { path = "crates/prism-env" }
prism-context = { path = "crates/prism-context" }
prism-store = { path = "crates/prism-store" }
prism-snapshot = { path = "crates/prism-snapshot" }
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c-sharp = "0.23"
