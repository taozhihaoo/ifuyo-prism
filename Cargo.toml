[workspace]
resolver = "2"
members = [
    "crates/prism-core",
    "crates/prism-project",
    "crates/prism-parser",
    "crates/prism-analysis",
    "crates/prism-graph",
    "crates/prism-git",
    "crates/prism-changes",
    "crates/prism-impact",
    "crates/prism-health",
    "crates/prism-cli",
    "src-tauri",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
log = { version = "0.4", features = ["std"] }
clap = { version = "4", features = ["derive"] }

prism-core = { path = "crates/prism-core" }
prism-project = { path = "crates/prism-project" }
prism-parser = { path = "crates/prism-parser" }
prism-analysis = { path = "crates/prism-analysis" }
prism-graph = { path = "crates/prism-graph" }
prism-git = { path = "crates/prism-git" }
prism-changes = { path = "crates/prism-changes" }
prism-impact = { path = "crates/prism-impact" }
prism-health = { path = "crates/prism-health" }
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c-sharp = "0.23"
