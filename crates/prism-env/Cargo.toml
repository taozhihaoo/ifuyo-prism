[package]
name = "prism-env"
description = "Prism environment facts layer: host/shell/PATH collection, tool discovery with allowlisted probes, structured versions, runtime/SDK/package-manager facts, requirement matching (M9a)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
prism-core.workspace = true
prism-project.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
