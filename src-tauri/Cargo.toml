[package]
name = "prism-app"
description = "Prism desktop application shell (Tauri 2) — thin IPC layer over prism-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "prism_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prism-core.workspace = true
prism-project.workspace = true
prism-analysis.workspace = true
prism-graph.workspace = true
prism-git.workspace = true
serde.workspace = true
log.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
